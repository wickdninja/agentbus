[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agentbus"
dynamic = ["version"]
description = "A shared inbox for the coding agents in your workspace: messages, file claims and shared facts over one SQLite file. No server, no dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/wickdninja/agentbus"

[project.scripts]
agentbus = "agentbus:cli"

# bin/agentbus is the single self-contained file `init` copies into repos. The wheel ships that same
# file as the top-level module agentbus.py, so the installed command and a repo copy are one file.
[tool.hatch.version]
path = "bin/agentbus"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"bin/agentbus" = "agentbus.py"

[tool.hatch.build.targets.sdist]
include = ["bin/agentbus", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "RELEASING.md", "pyproject.toml", "skills/", ".claude-plugin/", "hooks/", "scripts/", "docs/", "examples/", "tests/"]

# Static checks: `uvx ruff@0.17.4 check bin/agentbus scripts tests` (the "static" job in .github/workflows/test.yml).
# Real errors only (pyflakes, bugbear, syntax); no style rules. bin/agentbus has no .py suffix, so it is named on the command line.
# The per-file ignores are the hits that existed when the check was added (counts in the comments); new code gets none.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["F", "B", "E9"]

[tool.ruff.lint.per-file-ignores]
"bin/agentbus" = ["B007", "B904", "F811"]  # B007 x5, B904 x13, F811 x1
"scripts/agent-eval/run.py" = ["B904"]  # x1
"scripts/release_check.py" = ["F541"]  # x1
"tests/watch_live_cases.py" = ["B023", "B904", "F841"]  # B023 x10, B904 x1, F841 x1
