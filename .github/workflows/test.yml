name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # .github/workflows/release.yml runs the whole suite and the package matrix on a tag

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python has no 3.9 build for Ubuntu 26.04 or arm64 macOS, so the
          # 3.9 jobs use Ubuntu 24.04 and macOS's own /usr/bin/python3 (3.9.6).
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: macos-latest, python: system }
          - { os: macos-latest, python: "3.15" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.0"  # tests/test_package.sh builds and installs the wheel
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.python != 'system'
        id: py
        with:
          python-version: ${{ matrix.python }}
      - name: Pick Python
        run: echo "PYTHON=${{ steps.py.outputs.python-path || '/usr/bin/python3' }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Claude Code CLI (tests/test_plugin_manifest.sh runs `claude plugin validate .`, which needs no login)
        run: |
          # Exact version. No install scripts run: the package's own install.cjs is run by hand, after the registry's
          # integrity hash of the wrapper and of the platform build were checked against the values pinned here.
          set -e
          pin() { test "$(npm view "$1@2.1.316" dist.integrity)" = "$2"; }
          pin @anthropic-ai/claude-code sha512-i3BpzyDkcCPnsa0CSkWgxGPs7WMsyqDkxkqT0SDxyEC5XMIxEmcUmluWRHG9VSeBY8Vyv+l9X34JvJ/Bj54nBQ==
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) plat=linux-x64; sum=sha512-RQDM6N285IjNKcmlPRriayNzpTkEJreAw5/vBU+V0R3qljkQ5z6/pSbzcVUAXvasoOlvub0RIma3NWvSuZA8Cg== ;;
            Linux-aarch64) plat=linux-arm64; sum=sha512-xqlAkhgSLCMdcaepQNIs1+ym5X9++apiEeOc0LHRVOHpfLlpYKAaAXBRccM6QVITN0T9sXLCIby7CO1Lczusgw== ;;
            Darwin-arm64) plat=darwin-arm64; sum=sha512-wJiLVMzg2atF7C/a+0wt+yQShWIePsMNL86gIoIJanURY2fxrwHIxrYuxoTW8sWqfj7ai+otV/ik2r7m5aPy1g== ;;
            *) echo "no pinned Claude Code build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          pin "@anthropic-ai/claude-code-$plat" "$sum"
          npm install --global --ignore-scripts "@anthropic-ai/claude-code@2.1.316" "@anthropic-ai/claude-code-$plat@2.1.316"
          node "$(npm root --global)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      - name: Compile
        run: |
          "$PYTHON" -V
          "$PYTHON" -m py_compile bin/agentbus
      - name: Embedded skill is current
        run: |
          AGENTBUS_EMBED_CHECK=1 "$PYTHON" scripts/embed_skill.py --check
      - name: Tests
        # A skipped test file is a failure here (a skip means a change is missing); run_all writes the per-file times
        # to the step summary. The two files that run other tests again run once, in the mutations and eval-harness jobs.
        env:
          AGENTBUS_NO_SKIP: "1"
          AGENTBUS_EMBED_CHECK: "1"
        run: bash tests/run_all.sh --keep-going --skip-heavy

  # tests/test_mutations.sh breaks bin/agentbus on purpose, one entry of tests/mutations.json at a time, and needs a test
  # to notice: far too many runs for one job, so the entries are dealt to shards (scripts/mutate.py --shard I/N, whole
  # test files per shard) and each shard is one matrix job, on the oldest supported Python. The harness self-tests run
  # in every shard; a local run of the file without AGENTBUS_MUTATION_SHARD runs every entry.
  mutations:
    name: mutations (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py
        with:
          python-version: "3.9"
      - name: Pick Python
        run: echo "PYTHON=${{ steps.py.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: Mutation checks, one shard
        env:
          AGENTBUS_NO_SKIP: "1"
          AGENTBUS_EMBED_CHECK: "1"
          AGENTBUS_MUTATION_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: bash tests/run_all.sh --keep-going tests/test_mutations.sh

  # test_eval_harness.sh runs the agent-eval graders end to end; it has its own job so run_all's per-file cap is its own.
  eval-harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: py
        with:
          python-version: "3.9"
      - name: Pick Python
        run: echo "PYTHON=${{ steps.py.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: The agent-eval harness
        env:
          AGENTBUS_NO_SKIP: "1"
          AGENTBUS_EMBED_CHECK: "1"
        run: bash tests/run_all.sh --keep-going tests/test_eval_harness.sh

  # Every install path in the docs, built and run from the real artifacts, through the installed
  # executable only (scripts/verify_installed.sh), then once more with the installed file broken.
  package:
    name: package (${{ matrix.os }}, ${{ matrix.installer }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, installer: uv-wheel, python: "3.9" }
          - { os: ubuntu-24.04, installer: uv-sdist, python: "3.15" }
          - { os: ubuntu-24.04, installer: pipx-wheel, python: "3.15" }
          - { os: ubuntu-24.04, installer: pipx-sdist, python: "3.15" }
          - { os: macos-latest, installer: uv-wheel, python: "3.9" }
          - { os: macos-latest, installer: uv-sdist, python: "3.15" }
          - { os: macos-latest, installer: pipx-wheel, python: "3.15" }
          - { os: macos-latest, installer: pipx-sdist, python: "3.15" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: startsWith(matrix.installer, 'pipx')
        with:
          python-version: ${{ matrix.python }}
      - name: Build
        run: uv build --out-dir dist
      - name: Wheel members
        run: |
          python3 - <<'PY'
          import glob, re, zipfile
          z = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          extra = [n for n in z.namelist() if n != "agentbus.py" and not re.match(r"agentbus-[^/]+\.dist-info/", n)]
          assert "agentbus.py" in z.namelist() and not extra, extra
          assert z.read("agentbus.py") == open("bin/agentbus", "rb").read(), "agentbus.py differs from bin/agentbus"
          PY
      - name: Install (uv)
        if: startsWith(matrix.installer, 'uv')
        run: |
          artifact=$(ls dist/*.${{ endsWith(matrix.installer, 'wheel') && 'whl' || 'tar.gz' }})
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" "$artifact"
          echo "INSTALLED=$RUNNER_TEMP/venv/bin/agentbus" >> "$GITHUB_ENV"
          echo "INSTALLED_PY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
      - name: Install (pipx)
        if: startsWith(matrix.installer, 'pipx')
        run: |
          # One explicit interpreter for every pipx call in this job: the setup-python one, pipx installed into ITS site-packages
          # (not --user: a later step that changes HOME, as scripts/verify_update_layout.sh does, cannot see a user site).
          PIPX_PYTHON=$(python3 -c 'import sys; print(sys.executable)')
          "$PIPX_PYTHON" -m pip install pipx
          echo "PIPX_PYTHON=$PIPX_PYTHON" >> "$GITHUB_ENV"
          artifact=$(ls dist/*.${{ endsWith(matrix.installer, 'wheel') && 'whl' || 'tar.gz' }})
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          "$PIPX_PYTHON" -m pipx install "$artifact"
          echo "INSTALLED=$PIPX_BIN_DIR/agentbus" >> "$GITHUB_ENV"
          echo "INSTALLED_PY=$PIPX_HOME/venvs/agentbus/bin/python" >> "$GITHUB_ENV"
      - name: uvx runs the wheel
        if: matrix.installer == 'uv-wheel'
        run: uvx --from dist/*.whl agentbus --version
      - name: Verify the installed command
        # Every step runs: a skipped step fails the job, here as in release.yml.
        run: bash scripts/verify_installed.sh "$INSTALLED" "${{ matrix.installer }}"
      - name: update recognises this installer's real layout (a local tag pin, the release fixture)
        if: endsWith(matrix.installer, '-wheel')
        run: bash scripts/verify_update_layout.sh "${{ startsWith(matrix.installer, 'uv') && 'uv' || 'pipx' }}"
      - name: Negative control (a broken installed file must fail the verify)
        run: |
          file=$("$INSTALLED_PY" -c 'import agentbus; print(agentbus.__file__)')
          case "$file" in "$GITHUB_WORKSPACE"/*) echo "the installed module is inside the checkout: $file"; exit 1;; esac
          printf '\nimport sys; sys.exit(99)\n' >> "$file"
          if bash scripts/verify_installed.sh "$INSTALLED" broken > neg.out 2>&1; then
            echo "verify_installed.sh passed with a broken install; it ran the source"; cat neg.out; exit 1
          fi
          grep -qx 'FAIL step: --version equals __version__' neg.out || { cat neg.out; exit 1; }
      - name: Time to first handoff
        if: matrix.installer == 'uv-wheel'
        run: |
          bash scripts/ttfh.sh uv tool install "$PWD/$(ls dist/*.whl)" | tee ttfh.out
          cat ttfh.out >> "$GITHUB_STEP_SUMMARY"
