name: release

# A tag v* is a release. The path is: check the tag (shape, version, on main), run the whole test workflow,
# build ONCE, verify those exact files (members, install, negative control) and record their sha256s,
# then publish those same files as GitHub release assets, attested. GitHub Releases is the only channel
# (the name agentbus on PyPI belongs to an unrelated project). Every later job re-checks the files against
# the recorded sha256s, and verify_published installs what was published and compares again. Tags are
# vX.Y.Z or vX.Y.ZrcN; an rc is a prerelease and its version string carries the suffix. The tag ruleset
# is the owner's decision (RELEASING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tag shape
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]] || { echo "$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.ZrcN"; exit 1; }
      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Release check (version, CHANGELOG, pins, plugin, tag is on main)
        run: python3 scripts/release_check.py --tag "$GITHUB_REF_NAME"
      - name: Embedded skill is current
        run: AGENTBUS_EMBED_CHECK=1 python3 scripts/embed_skill.py --check

  test:
    needs: check
    uses: ./.github/workflows/test.yml

  build:
    needs: [check, test]
    runs-on: ubuntu-24.04
    outputs:
      sums: ${{ steps.sums.outputs.sums }}  # what later jobs check the files against; not only inside the artifact
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.0"
      - name: Build the wheel and the sdist (the only build in this workflow)
        run: uv build --out-dir dist
      - name: Verify those files and record their sha256s (dist/SHA256SUMS)
        run: bash scripts/verify_dist.sh dist
      - name: Emit the sha256s as a job output
        id: sums
        run: |
          { echo "sums<<SUMS_END"; cat dist/SHA256SUMS; echo "SUMS_END"; } >> "$GITHUB_OUTPUT"
      - name: Notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%rc*}"
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: The files are the ones that were verified
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          mkdir dist && mv *.whl *.tar.gz SHA256SUMS dist/
          printf '%s\n' "$SUMS" > expected-sums
          bash scripts/check_sums.sh dist expected-sums
      - name: The tag still points at the commit that was built
        run: |
          sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" | tail -n 1 | cut -f1)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "the tag $GITHUB_REF_NAME now points at $sha, not at the built commit $GITHUB_SHA"; exit 1; }
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the GitHub release from exactly those files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" =~ rc[0-9]+$ ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

  verify_published:
    # The README's literal pinned lines on clean runners after the tag exists, and the release assets
    # compared with the sha256s recorded before publishing. Skipped for rc tags, whose README pin is the
    # final version.
    needs: [build, publish]
    if: ${{ needs.publish.result == 'success' && !contains(github.ref_name, 'rc') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"
      - run: python3 -m pip install pipx
      - name: Install the published tag and compare the published files with the sha256s the build job emitted
        env:
          CI: "1"
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          printf '%s\n' "$SUMS" > expected-sums
          bash scripts/verify_published.sh "$GITHUB_REF_NAME" --sums expected-sums
